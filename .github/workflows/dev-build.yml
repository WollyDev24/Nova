name: Dev Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-build:
    name: Build Signed Dev APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties 2>/dev/null || true

      - name: Set up Google Services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Used GOOGLE_SERVICES_JSON from Actions secrets."
          elif [ -f app/google-services.json ]; then
            echo "Used committed app/google-services.json."
          else
            echo "Warning: app/google-services.json missing and secret not set."
          fi

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: Set up Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            printf 'storeFile=%s/keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Keystore signing configured with custom release keystore."
          else
            echo "No custom keystore secret detected. Using keystore/debug.keystore (SHA-1 registered in Firebase)."
          fi

      - name: Determine Version
        id: version
        run: |
          # 1. Extract current stable versionCode from app/build.gradle.kts
          STABLE_CODE=$(grep -oP 'versionCode\s*=\s*(overrideVersionCode\s*\?:\s*)?\K\d+' app/build.gradle.kts | head -n 1)
          if [ -z "$STABLE_CODE" ]; then
            STABLE_CODE="1011"
          fi

          # 2. Extract base versionName from latest stable release tag (excluding dev tags) or app/build.gradle.kts
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
          if [ -n "$LATEST_TAG" ]; then
            BASE_NAME="${LATEST_TAG#v}"
          else
            BASE_NAME=$(grep -oP 'versionName\s*=\s*(overrideVersionName\s*\?:\s*)?"\K[^"]+' app/build.gradle.kts | head -n 1)
          fi
          if [ -z "$BASE_NAME" ]; then
            BASE_NAME="1.1.1"
          fi

          # Match the current version code of the latest stable build, while only changing the version number
          VERSION_CODE="$STABLE_CODE"
          VERSION_NAME="${BASE_NAME}-dev.${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "base_name=$BASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Dev Version determined: Name=$VERSION_NAME, Code=$VERSION_CODE, Tag=$TAG_NAME (matched from latest stable build)"

      - name: Build Dev APK
        run: |
          echo "Building Nova Dev ${{ steps.version.outputs.version_name }} (Code: ${{ steps.version.outputs.version_code }})..."
          ./gradlew assembleDev \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            --full-stacktrace

      - name: Prepare Dev Artifacts
        id: artifacts
        run: |
          mkdir -p dev-apks
          ORIGINAL_APK=$(find app/build/outputs/apk/dev -name "*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: Dev APK not found!"
            exit 1
          fi
          TARGET_APK="dev-apks/Nova-${{ steps.version.outputs.version_name }}.apk"
          cp "$ORIGINAL_APK" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "Prepared dev APK at $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Publish Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Nova ${{ steps.version.outputs.version_name }}"
          target_commitish: ${{ github.sha }}
          body: |
            ### Automated Development Build (Commit: `${{ github.sha }}`)

            This is an automated development pre-release built directly from the `main` branch.
            - **Version Name**: `${{ steps.version.outputs.version_name }}`
            - **Version Code**: `${{ steps.version.outputs.version_code }}` *(matched from latest stable release)*
            - **Build Run**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`

            *Signed with keystore for seamless in-app upgrades via the Dev update channel.*
          files: dev-apks/*.apk
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Dev
          path: dev-apks/*.apk
          if-no-files-found: error
          retention-days: 30
