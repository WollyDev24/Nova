name: Debug Build

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties 2>/dev/null || true

      - name: Set up Google Services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Used GOOGLE_SERVICES_JSON from Actions secrets."
          elif [ -f app/google-services.json ]; then
            echo "Used committed app/google-services.json."
          fi

      - name: Build with Gradle
        run: ./gradlew assembleDebug --full-stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
